name: CI

# Runs on every pull request to main.
# cd.yml also calls this workflow after a merge, with push-image set to true.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      push-image:
        type: boolean
        default: false
    outputs:
      image:
        description: Full image name with tag
        value: ${{ jobs.image.outputs.image }}

jobs:
  # ---------- Stage 1: code checks (these three run in parallel) ----------
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  secrets-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  code-scan:
    name: Code scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: codeql-results
      # CodeQL reports findings but does not fail on its own. This step makes it a real gate.
      - name: Fail if CodeQL found problems
        run: |
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[] | "- \(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' codeql-results/*.sarif
            echo "::error::CodeQL found $count security problem(s). See the list above or the Security tab."
            exit 1
          fi

  # ---------- Stages 2 to 4: build, scan, push ----------
  image:
    name: Build and scan image
    needs: [test, secrets-scan, code-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${{ steps.meta.outputs.image }}"

      - name: Log in to GitHub Container Registry
        if: inputs.push-image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: inputs.push-image
        run: docker push "${{ steps.meta.outputs.image }}"
