name: CD

# Runs after code is merged into main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write
  pull-requests: read
  security-events: write

jobs:
  ci:
    name: Checks, build and push
    uses: ./.github/workflows/ci.yml
    with:
      push-image: true
    secrets: inherit

  staging:
    name: Staging
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.ci.outputs.image }}
    secrets: inherit

  production:
    name: Production
    needs: [ci, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.ci.outputs.image }}
    secrets: inherit

  # Optional: updates the live EC2 server after production passes.
  # Skipped until the EC2_HOST and EC2_SSH_KEY repository secrets are added.
  ec2:
    name: EC2
    needs: production
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Skip if EC2 is not set up
        if: env.EC2_HOST == ''
        run: echo "EC2_HOST secret is not set, skipping the EC2 deploy"

      - name: Deploy to EC2
        if: env.EC2_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=accept-new "ubuntu@$EC2_HOST" \
            "cd /opt/app && sudo git pull --ff-only && sudo bash scripts/ec2-update.sh"
